   name: Daily job scan
   on:
     schedule:
       - cron: "0 6 * * *"
     workflow_dispatch:
   permissions:
     contents: write
   jobs:
     run:
       runs-on: ubuntu-latest
       steps:
         - uses: actions/checkout@v4
         - uses: actions/setup-python@v5
           with:
             python-version: "3.12"
         - run: pip install -r requirements.txt
         - run: python main.py
           env:
             GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
         - name: Save results
           run: |
             git config user.name "github-actions"
             git config user.email "actions@github.com"
             git add seen.json results.md
             git commit -m "Update daily results" || echo "No changes"
             git push